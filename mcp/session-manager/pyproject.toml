[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-session-manager"
version = "0.4.1"
description = "Standalone OpenClaw MCP for guided browser login and secure local session storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.0.0",
]

[project.scripts]
session-manager = "session_manager.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
