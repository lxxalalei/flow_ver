interface:
  display_name: "Session Login Flow"
  short_description: "Guide browser login or authorized direct session import"
  default_prompt: "Use $session-login-flow to check the requested platform sessions and default to official browser login/capture. If I voluntarily provide a canonical Cookie/Token and explicitly name the supported platform, purpose, and permission to save, send it once only to session-manager without echoing, logging, forwarding, mixing with browser capture, or automatically replaying it."

dependencies:
  tools:
    - type: "mcp"
      value: "session-manager"
      description: "Session status, login guidance, server-side credential extraction, secure local save, validation, and deletion"

policy:
  allow_implicit_invocation: true
