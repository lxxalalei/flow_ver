        <h1>云为什么会下雨</h1>
        <p>太阳把地面和海洋里的水变成水蒸气，水蒸气上升后会遇冷。</p>
        <h2>从水蒸气到雨滴</h2>
        <p>小水滴在云里聚集，变得越来越大，最后在重力作用下落到地面。</p>
        <blockquote>云是天空中的一座小小水库。</blockquote>
