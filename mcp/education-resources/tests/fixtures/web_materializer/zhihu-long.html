<!doctype html>
<html lang="zh-CN">
  <head><title>一篇关于观察的长文</title></head>
  <body>
    <div class="QuestionPage">
      <div class="Answer">
        <article class="RichContent-inner">
          <h1>一篇关于观察的长文</h1>
          <p>观察不是匆匆看一眼，而是带着问题认真记录变化。</p>
          <p>当我们把一个大问题拆成几个小问题，就能从细节中找到线索，也能更容易复盘自己的判断。</p>
          <h2>可以怎样开始</h2>
          <ol>
            <li>先写下你真正想知道的问题。</li>
            <li>连续几天记录相同的现象。</li>
            <li>比较记录，再提出新的解释。</li>
          </ol>
          <blockquote>好的观察，会让熟悉的事物重新变得有趣。</blockquote>
          <pre><code class="language-text">记录 → 比较 → 提问</code></pre>
          <table>
            <tr><th>步骤</th><th>重点</th></tr>
            <tr><td>记录</td><td>尽量写事实</td></tr>
            <tr><td>比较</td><td>寻找相同与不同</td></tr>
          </table>
          <p>最后，把暂时不能解释的地方保留下来，它们往往是下一次探索的起点。</p>
        </article>
      </div>
    </div>
  </body>
</html>
