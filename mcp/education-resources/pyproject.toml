[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "education-resource-mcp"
version = "0.2.0"
description = "Local MCP service for education resource search, controlled download, jobs, and archive"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.0.0",
  "pycryptodome>=3.20",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.scripts]
education-resource-mcp = "education_resource_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running or environment-sensitive tests (E2E subprocess, storage migrations, contract parsing); use -m 'not slow' for fast daily runs",
]

