[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "education-resource-mcp"
version = "0.4.0"
description = "Thin MCP capability service for learning-resource discovery, expansion, inspection, acquisition and archive"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.0.0",
  "pycryptodome>=3.20",
  "beautifulsoup4>=4.12",
  "lxml>=6.1.1",
  "trafilatura>=2.1,<3",
]

[project.scripts]
education-resource-mcp = "education_resource_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
education_resource_mcp = [
  "library-taxonomy.json",
  "acquisition/vendor/simple.min.css",
  "acquisition/vendor/SIMPLE_CSS_LICENSE.txt",
  "vendor/cctv-h5e/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running or environment-sensitive tests",
]
