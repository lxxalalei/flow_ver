name: 0037 final acquisition validation

on:
  push:
    branches:
      - codex/growth-resource-taxonomy-rework

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./mcp/education-resources pytest
      - name: Compile active package
        run: python -m compileall -q mcp/education-resources/src
      - name: Parse JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('mcp/education-resources/contracts').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Run simplified acquisition unit tests
        working-directory: mcp/education-resources
        run: python -m pytest -q tests/test_acquisition_simplification_0037.py
      - name: Run MCP stdio business round trip
        working-directory: mcp/education-resources
        run: python -m pytest -q tests/test_mcp_stdio.py
