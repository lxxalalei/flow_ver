name: 0037 part2 legacy acquisition audit

on:
  push:
    branches:
      - codex/growth-resource-taxonomy-rework

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy acquisition references
        run: |
          echo '=== authority tables / request fields ==='
          git grep -nE 'capability_readiness_snapshots|eligibility_decisions|download_plan_items|job_execution_items|acquisition_outcomes|execution_binding_digest|readiness_snapshot_id|eligibility_id' -- mcp/education-resources/src mcp/education-resources/tests || true
          echo '=== compatibility contract files ==='
          git grep -nE 'capability-descriptors\.json|capability-descriptor(s)?\.schema\.json|deployment-readiness\.schema\.json|eligibility-decision\.schema\.json' -- README.md docs skills mcp/education-resources .agent/plans ':!mcp/education-resources/contracts/capabilities/capability-descriptors.json' || true
