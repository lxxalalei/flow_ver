name: 0037 part2 compatibility cutover

on:
  push:
    branches:
      - codex/growth-resource-taxonomy-rework

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover and apply staged patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          raw = subprocess.check_output(
              ["git", "show", "e73ca1e22c7a269926824a169eb8215e6563bd45:.github/workflows/0037-part2-cutover.yml"],
              text=True,
          )
          capture = False
          in_triple = False
          output = []
          for raw_line in raw.splitlines():
              if not capture:
                  if "python - <<'PY'" in raw_line:
                      capture = True
                  continue
              if not in_triple and raw_line == "          PY":
                  break
              line = raw_line
              if not in_triple and line.startswith("          "):
                  line = line[10:]
              output.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          Path("/tmp/0037-part2-cutover.py").write_text("\n".join(output) + "\n", encoding="utf-8")
          PY
          python /tmp/0037-part2-cutover.py
      - name: Remove materializer legacy request-class dependency
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mcp/education-resources/src/education_resource_mcp/acquisition/web_materializer.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''from .models import (\n    AcquisitionRequest,\n    AcquisitionResult,\n''',
              '''from .models import (\n    AcquisitionResult,\n''',
              1,
          )
          old = '''    def acquire(self, request: AcquisitionRequest) -> AcquisitionResult:\n        """Fetch and materialize one request using ``jobs_root/job_id`` only."""\n\n        if not isinstance(request, AcquisitionRequest):\n            raise TypeError("WebMaterializer.acquire expects AcquisitionRequest")\n        cancel_event = request.cancel_event\n'''
          new = '''    def acquire(self, request: Any) -> AcquisitionResult:\n        """Fetch and materialize one server-authored request using ``jobs_root/job_id`` only."""\n\n        cancel_event = request.cancel_event\n'''
          if old not in text:
              raise SystemExit('web materializer request check shape changed')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./mcp/education-resources pytest
      - name: Compile current package
        run: python -m compileall -q mcp/education-resources/src
      - name: Parse current JSON contracts
        run: python -c "import json; from pathlib import Path; [json.loads(p.read_text(encoding='utf-8')) for p in Path('mcp/education-resources/contracts').rglob('*.json')]"
      - name: Validate simplified state and runtime
        working-directory: mcp/education-resources
        run: |
          python -m pytest -q tests/test_acquisition_simplification_0037.py
          python -m pytest -q tests/test_mcp_stdio.py
      - name: Verify deleted authority compatibility
        run: |
          test ! -e mcp/education-resources/contracts/capabilities/capability-descriptors.json
          test ! -e mcp/education-resources/contracts/schemas/capability-descriptor.schema.json
          test ! -e mcp/education-resources/contracts/schemas/capability-descriptors.schema.json
          test ! -e mcp/education-resources/contracts/schemas/deployment-readiness.schema.json
          test ! -e mcp/education-resources/contracts/schemas/eligibility-decision.schema.json
          if git grep -nE 'Capability Descriptor -> Deployment Readiness|execution_binding_digest|readiness_snapshot_id|eligibility_id' -- mcp/education-resources/contracts/README.md mcp/education-resources/contracts/platforms/README.md; then exit 1; fi
          if git grep -n 'WebMaterializer.acquire expects AcquisitionRequest' -- mcp/education-resources/src; then exit 1; fi
      - name: Commit successful cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/0037-part2-cutover.yml .github/workflows/0037-part2-audit.yml
          git add mcp/education-resources/src mcp/education-resources/tests/test_acquisition_simplification_0037.py mcp/education-resources/contracts
          git commit -m 'refactor: remove acquisition authority compatibility layer'
          git push origin HEAD:codex/growth-resource-taxonomy-rework
