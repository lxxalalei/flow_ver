name: 0037 part2 compatibility cutover

on:
  push:
    branches:
      - codex/growth-resource-taxonomy-rework

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover and apply staged patch script
        run: |
          git show HEAD^:.github/workflows/0037-part2-cutover.yml \
            | sed -n "/python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/0037-part2-cutover.py
          python /tmp/0037-part2-cutover.py
      - name: Install service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./mcp/education-resources pytest
      - name: Compile current package
        run: python -m compileall -q mcp/education-resources/src
      - name: Parse current JSON contracts
        run: |
          python -c "import json; from pathlib import Path; [json.loads(p.read_text(encoding='utf-8')) for p in Path('mcp/education-resources/contracts').rglob('*.json')]"
      - name: Validate simplified state and runtime
        working-directory: mcp/education-resources
        run: |
          python -m pytest -q tests/test_acquisition_simplification_0037.py
          python -m pytest -q tests/test_mcp_stdio.py
      - name: Verify deleted authority contract artifacts
        run: |
          test ! -e mcp/education-resources/contracts/capabilities/capability-descriptors.json
          test ! -e mcp/education-resources/contracts/schemas/capability-descriptor.schema.json
          test ! -e mcp/education-resources/contracts/schemas/capability-descriptors.schema.json
          test ! -e mcp/education-resources/contracts/schemas/deployment-readiness.schema.json
          test ! -e mcp/education-resources/contracts/schemas/eligibility-decision.schema.json
          if git grep -nE 'Capability Descriptor -> Deployment Readiness|authority_digest|execution_binding_digest|readiness_snapshot_id|eligibility_id' -- mcp/education-resources/contracts/README.md mcp/education-resources/contracts/platforms/README.md; then exit 1; fi
      - name: Commit successful cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/0037-part2-cutover.yml .github/workflows/0037-part2-audit.yml
          git add mcp/education-resources/src mcp/education-resources/tests/test_acquisition_simplification_0037.py mcp/education-resources/contracts
          git commit -m 'refactor: remove acquisition authority compatibility layer'
          git push origin HEAD:codex/growth-resource-taxonomy-rework
