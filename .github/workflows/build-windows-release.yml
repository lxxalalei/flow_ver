name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - codex/growth-resource-taxonomy-rework
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-windows-release.yml'
      - 'packaging/windows/**'
      - 'scripts/build-release.ps1'
      - 'mcp/education-resources/pyproject.toml'
      - 'mcp/education-resources/src/**'
      - 'mcp/education-resources/scripts/verify_runtime_environment.py'
      - 'skills/SKILL.md'
      - 'skills/references/**'

permissions:
  contents: read

jobs:
  build-and-install-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse installer
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content packaging/windows/install.ps1 -Raw))
          Write-Host 'install.ps1 syntax OK'

      - name: Build clean release ZIP
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Inspect release contents
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          if (-not $zip) { throw 'release ZIP not found' }
          Expand-Archive $zip.FullName -DestinationPath release-check
          $root = Get-ChildItem release-check -Directory | Select-Object -First 1
          if (-not $root) { throw 'release root directory not found' }
          Write-Host 'Release root:' $root.FullName
          Get-ChildItem $root.FullName -Recurse | ForEach-Object {
            $_.FullName.Substring($root.FullName.Length).TrimStart('\')
          }

      - name: Install OpenClaw baseline for smoke test
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -UseBasicParsing 'https://openclaw.ai/install.ps1'
          $installer = if ($response.Content -is [byte[]]) {
            [Text.Encoding]::UTF8.GetString([byte[]]$response.Content)
          } else {
            [string]$response.Content
          }
          & ([scriptblock]::Create($installer)) -NoOnboard
          $env:Path = @(
            [Environment]::GetEnvironmentVariable('Path', 'Machine'),
            [Environment]::GetEnvironmentVariable('Path', 'User')
          ) -join ';'
          openclaw setup --baseline
          openclaw --version

      - name: Install from packaged release
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath install-smoke
          $root = Get-ChildItem install-smoke -Directory | Select-Object -First 1
          if (-not $root) { throw 'release root directory not found' }
          & (Join-Path $root.FullName 'install.ps1') -SkipOpenClawOnboarding

      - name: Verify installed runtime
        shell: pwsh
        run: |
          $mcpExe = Join-Path $env:LOCALAPPDATA 'LearningResourceFlow\venv\Scripts\education-resource-mcp.exe'
          if (-not (Test-Path $mcpExe)) { throw "MCP executable not installed: $mcpExe" }
          openclaw skills list | Select-String 'learning-resource-flow'
          openclaw mcp doctor education-resources --probe

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: learning-resource-flow-windows
          path: dist/*.zip
          if-no-files-found: error
