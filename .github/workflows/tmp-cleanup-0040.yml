name: focused acquisition cleanup

on:
  push:
    branches:
      - codex/growth-resource-taxonomy-rework

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused cleanup
        run: python .agent/tmp_cleanup_0040.py
      - name: Install MCP test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./mcp/education-resources pytest
      - name: Compile active package
        run: python -m compileall -q mcp/education-resources/src
      - name: Parse current JSON contracts
        run: python -c "import json; from pathlib import Path; [json.loads(p.read_text(encoding='utf-8')) for p in Path('mcp/education-resources/contracts').rglob('*.json')]"
      - name: Run acquisition and service regressions
        working-directory: mcp/education-resources
        run: |
          python -m pytest -q \
            tests/test_acquisition_core.py \
            tests/test_acquisition_simplification_0037.py \
            tests/test_service.py \
            tests/test_platform_registry.py \
            tests/test_mcp_stdio.py
      - name: Verify cleanup invariants
        run: |
          ! git grep -n 'capability_registry_snapshot' -- mcp/education-resources/src mcp/education-resources/tests
          ! git grep -nE 'CAPABILITY_SCOPES|CapabilityScope|_authority_kwargs|_AUTHORITY_METADATA_KEYS|_without_authority_metadata' -- mcp/education-resources/src mcp/education-resources/tests
          ! git grep -n 'simple_service.py' -- .agent/plans/0039-download-platform-active-expansion.md docs/CURRENT_ARCHITECTURE.md
          ! git grep -n 'except Exception:$' -- mcp/education-resources/src/education_resource_mcp/service.py
          git diff --check
      - name: Commit validated cleanup
        run: |
          rm -f .agent/tmp_cleanup_0040.py .github/workflows/tmp-cleanup-0040.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: clean residual acquisition compatibility names'
          git push origin HEAD:codex/growth-resource-taxonomy-rework
